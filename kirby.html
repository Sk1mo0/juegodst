<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kirby</title>

    <style>
      svg {
        width: 300px;
      }

      .smoke {
        fill: #cccccc;
        opacity: 0.5;
      }
      .body {
        fill: #ffb7c5;
        stroke: #d88194;
        stroke-width: 1;
      }

      .feet {
        fill: #ff0000;
      }

      .arm {
        fill: #ffb7c5;
      }

      .eye {
        fill: black;
      }

      .eyeShine {
        fill: white;
      }

      .eyeBlue {
        fill: #1e3a8a;
      }

      .cheek {
        fill: #ff6f91;
        opacity: 0.6;
      }
      .handle {
        fill: #6d530c;
      }
      .cannon {
        fill: #595853;
      }
      .blunt {
        fill: #8b5a2b;
      }
      .tip {
        fill: #de9c47;
      }
    </style>
  </head>

  <body>
    <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
      <title>Ilustración vectorial de Kirby</title>
      <g transform="translate(10 0)">
        <ellipse class="feet" cx="30" cy="85" rx="15" ry="10" />
        <ellipse class="feet" cx="70" cy="85" rx="15" ry="10" />

        <ellipse
          class="arm"
          cx="15"
          cy="55"
          rx="8"
          ry="5"
          transform="rotate(-20 15 55)"
        />

        <polygon
          points="6,54 20,52 20,56 6,56"
          class="blunt"
          transform="rotate(170 10 55)"
        />

        <ellipse
          cx="0.7"
          cy="52.5"
          rx="1.5"
          ry="2"
          class="tip"
          transform="rotate(-20 15 55)"
        />
        <ellipse
          cx="2"
          cy="45.5"
          rx="3"
          ry="2"
          class="smoke"
          transform="rotate(-20 15 55)"
        />
        <ellipse
          cx="2"
          cy="35"
          rx="7"
          ry="3"
          class="smoke"
          transform="rotate(-20 15 55)"
        />

        <ellipse
          class="arm"
          cx="85"
          cy="55"
          rx="8"
          ry="5"
          transform="rotate(20 85 55)"
        />

        <rect
          class="handle"
          x="88"
          y="53"
          width="5"
          height="14"
          transform="rotate(20 85 55)"
        ></rect>
        <rect
          class="cannon"
          x="88"
          y="50"
          width="20"
          height="6"
          transform="rotate(20 85 55)"
        ></rect>
        <line
          x1="90"
          y1="51"
          x2="106"
          y2="51"
          stroke="black"
          stroke-width="0.5"
          transform="rotate(20 85 55)"
        />
        <circle
          cx="106.5"
          cy="53"
          r="1"
          fill="black"
          transform="rotate(20 85 55)"
        />
        <path
          d="M 93 58 Q 94.5 58 95 56"
          stroke="black"
          stroke-width="0.6"
          fill="none"
          transform="rotate(20 85 55)"
        />
        <circle class="body" cx="50" cy="55" r="35" />

        <g id="eyes">
          <ellipse class="eye" cx="43" cy="48" rx="3" ry="8" />
          <ellipse class="eyeShine" cx="43" cy="44" rx="1.2" ry="2" />
          <ellipse class="eyeBlue" cx="43" cy="52" rx="2" ry="3" />

          <ellipse class="eye" cx="57" cy="48" rx="3" ry="8" />
          <ellipse class="eyeShine" cx="57" cy="44" rx="1.2" ry="2" />
          <ellipse class="eyeBlue" cx="57" cy="52" rx="2" ry="3" />
        </g>

        <ellipse class="cheek" cx="30" cy="60" rx="5" ry="3" />
        <ellipse class="cheek" cx="70" cy="60" rx="5" ry="3" />
        <text
          x="42"
          y="37"
          font-size="6"
          text-anchor="middle"
          fill="black"
          font-family="cursive"
          transform="rotate(-10 50 38)"
        >
          Romeo
        </text>

        <path
          d="M 40 64 Q 46 70 50 66 Q 54 62 60 64"
          stroke="black"
          stroke-width="1.2"
          fill="none"
          stroke-linecap="round"
        />

        <polygon
          points="44,68 46,71 48,68"
          fill="#fff2a8"
          stroke="black"
          stroke-width="0.3"
        />

        <ellipse
          cx="55"
          cy="66.6"
          rx="2.5"
          ry="2"
          fill="#ff6fa5"
          transform="rotate(20 57 67)"
        />
        <line
          x1="54"
          y1="63.5"
          x2="56"
          y2="68"
          stroke="black"
          stroke-width="0.5"
        ></line>
      </g>
    </svg>
  </body>
</html>
